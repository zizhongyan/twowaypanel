[build-system]
requires = ["flit_core >=3.2,<4", "setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twowaypanel"
version = "0.9.5"
description = "Econometric Analysis of Nonlinear Panel Models with Individual and Time Effects"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Zizhong Yan" }
]
license = { text = "MIT" }

keywords = [
    "econometrics",
    "panel data",
    "two-way fixed effects",
    "python"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering"
]

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels"
]

[project.urls]
Homepage = "https://github.com/zizhongyan/twowaypanel"
Documentation = "https://twowaypanel.readthedocs.io/"
Repository = "https://github.com/zizhongyan/twowaypanel"
Issues = "https://github.com/zizhongyan/twowaypanel/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["twowaypanel*"]